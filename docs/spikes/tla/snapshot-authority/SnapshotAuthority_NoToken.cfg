\* _NoToken (negative control, Astra 0261 H2): bypasses only the completion-attempt token comparison after
\* awaits; the runGen check stays (Astra 0272 #6). MidRunCs gives the cancel path within one generation
\* (mid-run done -> attempt -> working -> Cancel -> stale scrape resolves).
\* Expected: Invariant NoStaleAttempt VIOLATED.
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = TRUE
  MidRunCs = TRUE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = FALSE
  SlowResp = FALSE
  PermFail = FALSE
  RepeatFail = FALSE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleAttempt
CHECK_DEADLOCK FALSE
