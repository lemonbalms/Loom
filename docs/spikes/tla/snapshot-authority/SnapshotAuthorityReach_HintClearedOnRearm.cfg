\* Reach (MidRunCs + Hint, Astra 0272 #4): an R69-M2 Rearm clears a permission_prompt hint set before it, and the
\* rearmed attempt completes as done (test ㊹). Expected: Invariant NotHintClearedOnRearm VIOLATED.
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = TRUE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = FALSE
  SlowResp = FALSE
  PermFail = FALSE
  RepeatFail = FALSE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NotHintClearedOnRearm
CHECK_DEADLOCK FALSE
