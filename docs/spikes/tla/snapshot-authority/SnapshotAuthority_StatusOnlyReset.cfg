\* _StatusOnlyReset (negative control, Astra 0272 #3): the retracted W-reset guard — reset on scs > lastAppliedScs
\* or any status change regardless of scs > b, and old-generation (discarded) responses reset too. The flag
\* bypasses only the reset guard. Path: reused pane baseline done / scs = b -> focus done -> idle (scs unchanged)
\* -> applied idle at scs = b resets W. Expected: Invariant WResetAuthorized VIOLATED.
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = FALSE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = FALSE
  SlowResp = FALSE
  PermFail = FALSE
  RepeatFail = FALSE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle", "done"}
  TrackOld = FALSE
  StatusOnlyReset = TRUE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK WResetAuthorized
CHECK_DEADLOCK FALSE
