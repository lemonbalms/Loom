\* Reach (_SlowResp constants, Astra 0272 #5 · 0275 #1): the window fires while a poll request is in flight that was
\* issued before W expired (pRem > 0) and before the agent's completion, has been outstanding >= 1 tick and >= the
\* remaining W at its issue time (the response-delay boundary itself, not a queued poll or a zero-latency issue at
\* expiry). Expected: Invariant NotSlowRespWindow VIOLATED.
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = FALSE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = FALSE
  SlowResp = TRUE
  PermFail = FALSE
  RepeatFail = FALSE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NotSlowRespWindow
CHECK_DEADLOCK FALSE
