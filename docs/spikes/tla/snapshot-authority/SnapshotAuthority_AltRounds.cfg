\* _AltRounds (Astra 0266 #1): undelivered prompt, intermittent failures make undelivered / unknown rounds
\* alternate, herdr may then go permanently down. Expected: No error — every round consumes a retry or lets W
\* run; result \in {unconfirmed, failed_unavail} (AltResultOK); ER.
