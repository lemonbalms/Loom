\* Reach (LateDelivery = TRUE): the key-before cache check cancels a confirmed reinject (Astra 0266 #2, test ㉘).
\* With LateDelivery = FALSE a delivered prompt is always seen before the late half, so this needs the late start.
\* Expected: Invariant NotCancelReinject VIOLATED.
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = FALSE
  Blocked = FALSE
  LateDelivery = TRUE
  Undeliverable = FALSE
  SlowResp = FALSE
  PermFail = FALSE
  RepeatFail = FALSE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle", "done"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NotCancelReinject
CHECK_DEADLOCK FALSE
