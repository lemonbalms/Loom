\* _NoAgentFinish (Astra 0272 #2, record): _Base world under SpecNoAgentFinish (drops WF(AgentFinish) — the
\* environment assumption "a running card agent eventually stops working"). A delivered card that works forever
\* keeps resetting W (current gen, scs > b, working — R10). Outside P0: the existing card timeout / still-running
\* path owns it. Expected: Temporal property EventuallyResolved VIOLATED.
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = FALSE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = FALSE
  SlowResp = FALSE
  PermFail = FALSE
  RepeatFail = FALSE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle", "done", "working"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION SpecNoAgentFinish
INVARIANTS TypeOK
PROPERTIES EventuallyResolved
CHECK_DEADLOCK FALSE
