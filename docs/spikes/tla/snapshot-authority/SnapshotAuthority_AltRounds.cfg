  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = FALSE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = TRUE
  SlowResp = FALSE
  PermFail = TRUE
  RepeatFail = TRUE
  MaxFail = 0
  MaxRetries = 2
  W = 3
  WaitT = 2
  InitSts = {"idle", "done"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOneResult NoMixedAuthority NoStaleAttempt NoDiscardedDelivery ReinjectBaselineIsEvidence WResetAuthorized AltResultOK
PROPERTIES EventuallyResolved
