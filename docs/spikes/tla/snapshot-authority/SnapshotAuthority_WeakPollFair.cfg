\* _WeakPollFair (Astra 0272 #2): _RepeatFail world under SpecWeakPollFair (SF(PollOk) replaced by WF(PollOk) —
\* with RepeatFail every in-flight request may fail, so polls can fail forever). Expected: No error — ER holds via
\* W expiry (no successful snapshot = no reset; undelivered resets bounded by retries); CWAC-Final holds because
\* its antecedent is the already-applied final completion, after which only the scrape (implementation WF) runs.
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = FALSE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = FALSE
  SlowResp = FALSE
  PermFail = FALSE
  RepeatFail = TRUE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle", "done", "working"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION SpecWeakPollFair
INVARIANTS TypeOK NoEarlyCompletion NoFalseCompletion AtMostOneResult NoMixedAuthority NoStaleAttempt NoDiscardedDelivery ReinjectBaselineIsEvidence WResetAuthorized
PROPERTIES EventuallyResolved CompletesWhenAgentCompletes
CHECK_DEADLOCK FALSE
