\* Reach (_AltRounds constants, Astra 0272 #5): >= 1 "undelivered" round (retry consumed) and >= 1 "unknown" round
\* in the same flight, permanent failure (GoDown) after an "undelivered" classification (Astra 0275 #2), then a
\* terminal result \in {unconfirmed, failed_unavail}.
\* Expected: Invariant NotAltRoundsMix VIOLATED.
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = FALSE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = TRUE
  SlowResp = FALSE
  PermFail = TRUE
  RepeatFail = TRUE
  MaxFail = 0
  MaxRetries = 2
  W = 3
  WaitT = 2
  InitSts = {"idle", "done"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NotAltRoundsMix
CHECK_DEADLOCK FALSE
