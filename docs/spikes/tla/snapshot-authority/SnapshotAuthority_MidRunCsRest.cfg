\* _MidRunCsRest: MidRunCs world (Cancel / Rearm / M2 paths live) with every invariant except NoEarlyCompletion
\* (that one is the _MidRunCs declared-limit violation). Hint = TRUE (Astra 0272 #4): one permission_prompt hint may
\* arrive during the run; NoStaleHintAfterRearm checks the R69-M2 hint clear. Expected: No error — tokens hold under
\* cancel/rearm, no stale hint survives a Rearm, CWAC-Final (Completed incl. a fresh-hint agent_blocked correction).
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = TRUE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = FALSE
  SlowResp = FALSE
  PermFail = FALSE
  RepeatFail = FALSE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle", "done", "working"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoFalseCompletion AtMostOneResult NoMixedAuthority NoStaleAttempt NoDiscardedDelivery ReinjectBaselineIsEvidence WResetAuthorized NoStaleHintAfterRearm
PROPERTIES EventuallyResolved CompletesWhenAgentCompletes
CHECK_DEADLOCK FALSE
