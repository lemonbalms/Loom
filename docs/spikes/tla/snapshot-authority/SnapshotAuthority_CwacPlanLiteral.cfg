\* _CwacPlanLiteral (Astra 0272 #1, record): MidRunCs world, PLAN's literal CWAC antecedent — *a* current-gen
\* snapshot with status \in {done, idle} /\ cs > lastConsumedCs applied before expiry (intermediate completions
\* count). Path: intermediate completion applied -> attempt -> snapshot working cancels it (R6 ①) -> the window
\* expires before the final completion snapshot applies. Expected: Temporal property
\* CompletesWhenAgentCompletesPlan VIOLATED (PLAN's literal antecedent is too weak once a completion is cancelled).
CONSTANTS
  Capable = TRUE
  PendingAsFallback = FALSE
  NoFence = FALSE
  NoToken = FALSE
  MidRunCs = TRUE
  Blocked = FALSE
  LateDelivery = FALSE
  Undeliverable = FALSE
  SlowResp = FALSE
  PermFail = FALSE
  RepeatFail = FALSE
  MaxFail = 0
  MaxRetries = 1
  W = 3
  WaitT = 2
  InitSts = {"idle"}
  TrackOld = FALSE
  StatusOnlyReset = FALSE
  NoHintClear = FALSE
  Hint = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK
PROPERTIES CompletesWhenAgentCompletesPlan
CHECK_DEADLOCK FALSE
